<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BT Mike - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      font-family: Arial, sans-serif;
      color: white;

      background:
        radial-gradient(
          circle at top left,
          rgba(108,99,255,.25),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #05060b,
          #0b1020
        );

      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 430px;

      padding: 35px;

      border-radius: 25px;

      background: rgba(18,23,38,.80);

      border: 1px solid rgba(255,255,255,.1);

      backdrop-filter: blur(20px);

      box-shadow:
        0 25px 80px rgba(0,0,0,.45);
    }

    .logo {
      width: 60px;
      height: 60px;

      margin: 0 auto 18px;

      display: grid;
      place-items: center;

      border-radius: 18px;

      font-size: 28px;

      background:
        linear-gradient(
          135deg,
          #6c63ff,
          #9a73ff
        );
    }

    h1 {
      text-align: center;
      font-size: 30px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #8d96aa;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 8px;

      padding: 5px;

      border-radius: 12px;

      background: rgba(255,255,255,.05);

      margin-bottom: 22px;
    }

    .tab {
      padding: 11px;

      border: none;

      border-radius: 9px;

      background: transparent;

      color: #8d96aa;

      cursor: pointer;

      font-weight: bold;
    }

    .tab.active {
      color: white;

      background: #6c63ff;
    }

    .input-group {
      margin-bottom: 15px;
    }

    label {
      display: block;

      font-size: 12px;

      color: #aab1c2;

      margin-bottom: 7px;
    }

    input {
      width: 100%;

      padding: 14px;

      border-radius: 11px;

      border: 1px solid rgba(255,255,255,.1);

      background: rgba(0,0,0,.25);

      color: white;

      outline: none;

      font-size: 14px;
    }

    input:focus {
      border-color: #6c63ff;

      box-shadow:
        0 0 0 3px
        rgba(108,99,255,.12);
    }

    .phone-row {
      display: flex;
      gap: 8px;
    }

    .country-code {
      width: 85px;
    }

    .phone-number {
      flex: 1;
    }

    .main-btn {
      width: 100%;

      padding: 14px;

      margin-top: 5px;

      border: none;

      border-radius: 12px;

      color: white;

      font-size: 15px;

      font-weight: bold;

      cursor: pointer;

      background:
        linear-gradient(
          135deg,
          #6c63ff,
          #817aff
        );

      box-shadow:
        0 10px 25px
        rgba(108,99,255,.25);
    }

    .main-btn:hover {
      transform: translateY(-1px);
    }

    .message {
      display: none;

      padding: 12px;

      margin-top: 15px;

      border-radius: 10px;

      font-size: 13px;

      text-align: center;
    }

    .error {
      display: block;

      color: #ff8297;

      background: rgba(255,85,113,.1);
    }

    .success {
      display: block;

      color: #51e6a3;

      background: rgba(37,217,139,.1);
    }

    #recaptcha-container {
      margin: 15px 0;
    }

    .hidden {
      display: none;
    }

    .back {
      display: block;

      text-align: center;

      margin-top: 22px;

      color: #8d96aa;

      text-decoration: none;

      font-size: 13px;
    }

    .back:hover {
      color: white;
    }

    @media (max-width: 450px) {
      .login-card {
        padding: 25px 20px;
      }
    }
  </style>
</head>

<body>

  <div class="login-card">

    <div class="logo">
      🎙️
    </div>

    <h1>Welcome to BT Mike</h1>

    <p class="subtitle">
      Login to use your wireless microphone
    </p>


    <!-- LOGIN METHOD -->

    <div class="tabs">

      <button
        id="emailTab"
        class="tab active"
        onclick="showEmail()"
      >
        📧 Email
      </button>

      <button
        id="phoneTab"
        class="tab"
        onclick="showPhone()"
      >
        📱 Mobile
      </button>

    </div>


    <!-- EMAIL LOGIN -->

    <div id="emailSection">

      <div class="input-group">

        <label>Email Address</label>

        <input
          type="email"
          id="email"
          placeholder="you@example.com"
        >

      </div>


      <div class="input-group">

        <label>Password</label>

        <input
          type="password"
          id="password"
          placeholder="Enter password"
        >

      </div>


      <button
        class="main-btn"
        onclick="emailLogin()"
      >
        🔐 Login with Email
      </button>


      <button
        class="main-btn"
        style="
          margin-top:10px;
          background:rgba(255,255,255,.07);
        "
        onclick="emailSignup()"
      >
        📝 Create Account
      </button>

    </div>


    <!-- PHONE LOGIN -->

    <div
      id="phoneSection"
      class="hidden"
    >

      <div class="input-group">

        <label>Mobile Number</label>

        <div class="phone-row">

          <input
            class="country-code"
            id="countryCode"
            value="+91"
            placeholder="+91"
          >

          <input
            class="phone-number"
            id="phone"
            type="tel"
            placeholder="9876543210"
          >

        </div>

      </div>


      <div id="recaptcha-container"></div>


      <button
        class="main-btn"
        onclick="sendOTP()"
      >
        📲 Send OTP
      </button>


      <div
        id="otpSection"
        class="hidden"
        style="margin-top:15px;"
      >

        <div class="input-group">

          <label>Enter OTP</label>

          <input
            id="otp"
            type="text"
            maxlength="6"
            placeholder="123456"
          >

        </div>


        <button
          class="main-btn"
          onclick="verifyOTP()"
        >
          ✅ Verify OTP
        </button>

      </div>

    </div>


    <div
      id="message"
      class="message"
    ></div>


    <a
      href="index.html"
      class="back"
    >
      ← Back to BT Mike
    </a>

  </div>


  <!-- FIREBASE -->

  <script type="module">

    import {
      initializeApp
    } from
    "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      signInWithPhoneNumber,
      RecaptchaVerifier
    } from
    "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


    /*
    =====================================================
    PASTE YOUR FIREBASE CONFIG HERE
    =====================================================
    */

    const firebaseConfig = {

      apiKey: "YOUR_API_KEY",

      authDomain:
        "YOUR_PROJECT.firebaseapp.com",

      projectId:
        "YOUR_PROJECT_ID",

      storageBucket:
        "YOUR_PROJECT.firebasestorage.app",

      messagingSenderId:
        "YOUR_MESSAGING_SENDER_ID",

      appId:
        "YOUR_APP_ID"

    };


    /*
    Initialize Firebase
    */

    const app =
      initializeApp(firebaseConfig);


    const auth =
      getAuth(app);


    /*
    =====================================================
    EMAIL LOGIN
    =====================================================
    */

    window.emailLogin = async function () {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      if (!email || !password) {

        showMessage(
          "Please enter email and password.",
          "error"
        );

        return;

      }


      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


        showMessage(
          "Login successful! Redirecting...",
          "success"
        );


        setTimeout(() => {

          window.location.href =
            "index.html";

        }, 1000);


      } catch (error) {

        showMessage(
          getFirebaseError(error),
          "error"
        );

      }

    };


    /*
    =====================================================
    EMAIL SIGN UP
    =====================================================
    */

    window.emailSignup = async function () {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      if (!email || !password) {

        showMessage(
          "Please enter email and password.",
          "error"
        );

        return;

      }


      if (password.length < 6) {

        showMessage(
          "Password must contain at least 6 characters.",
          "error"
        );

        return;

      }


      try {

        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );


        showMessage(
          "Account created successfully!",
          "success"
        );


        setTimeout(() => {

          window.location.href =
            "index.html";

        }, 1000);


      } catch (error) {

        showMessage(
          getFirebaseError(error),
          "error"
        );

      }

    };


    /*
    =====================================================
    PHONE OTP
    =====================================================
    */

    let confirmationResult;


    window.sendOTP = async function () {

      const country =
        document.getElementById("countryCode")
          .value.trim();

      const phone =
        document.getElementById("phone")
          .value.trim();


      if (!phone) {

        showMessage(
          "Please enter your mobile number.",
          "error"
        );

        return;

      }


      const fullPhone =
        country + phone;


      try {

        if (!window.recaptchaVerifier) {

          window.recaptchaVerifier =
            new RecaptchaVerifier(
              auth,
              "recaptcha-container",
              {
                size: "normal"
              }
            );

        }


        confirmationResult =
          await signInWithPhoneNumber(
            auth,
            fullPhone,
            window.recaptchaVerifier
          );


        document
          .getElementById("otpSection")
          .classList.remove("hidden");


        showMessage(
          "OTP sent successfully.",
          "success"
        );


      } catch (error) {

        showMessage(
          getFirebaseError(error),
          "error"
        );

      }

    };


    /*
    =====================================================
    VERIFY OTP
    =====================================================
    */

    window.verifyOTP = async function () {

      const otp =
        document.getElementById("otp")
          .value.trim();


      if (!confirmationResult) {

        showMessage(
          "Please request an OTP first.",
          "error"
        );

        return;

      }


      if (!otp) {

        showMessage(
          "Please enter the OTP.",
          "error"
        );

        return;

      }


      try {

        await confirmationResult.confirm(
          otp
        );


        showMessage(
          "Phone verified! Redirecting...",
          "success"
        );


        setTimeout(() => {

          window.location.href =
            "index.html";

        }, 1000);


      } catch (error) {

        showMessage(
          "Invalid OTP. Please try again.",
          "error"
        );

      }

    };


    /*
    =====================================================
    FIREBASE ERROR MESSAGE
    =====================================================
    */

    function getFirebaseError(error) {

      switch (error.code) {

        case "auth/invalid-credential":
          return "Invalid email or password.";

        case "auth/email-already-in-use":
          return "This email is already registered.";

        case "auth/invalid-email":
          return "Please enter a valid email address.";

        case "auth/weak-password":
          return "Password is too weak.";

        case "auth/too-many-requests":
          return "Too many attempts. Please try again later.";

        case "auth/invalid-phone-number":
          return "Invalid mobile number.";

        case "auth/quota-exceeded":
          return "OTP limit exceeded. Try again later.";

        default:
          return error.message || "Something went wrong.";

      }

    }


    /*
    =====================================================
    MESSAGE
    =====================================================
    */

    function showMessage(text, type) {

      const box =
        document.getElementById("message");

      box.innerText = text;

      box.className =
        "message " + type;

    }

  </script>


  <script>

    /*
    =====================================================
    SWITCH EMAIL / PHONE
    =====================================================
    */

    function showEmail() {

      document
        .getElementById("emailSection")
        .classList.remove("hidden");

      document
        .getElementById("phoneSection")
        .classList.add("hidden");


      document
        .getElementById("emailTab")
        .classList.add("active");

      document
        .getElementById("phoneTab")
        .classList.remove("active");

    }


    function showPhone() {

      document
        .getElementById("emailSection")
        .classList.add("hidden");

      document
        .getElementById("phoneSection")
        .classList.remove("hidden");


      document
        .getElementById("emailTab")
        .classList.remove("active");

      document
        .getElementById("phoneTab")
        .classList.add("active");

    }

  </script>

</body>
</html>
