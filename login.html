<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#070910">

  <title>BT Mike - Login</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      font-family:
        Arial,
        sans-serif;

      color: white;

      background:
        radial-gradient(
          circle at 20% 10%,
          rgba(108,99,255,.25),
          transparent 35%
        ),
        radial-gradient(
          circle at 90% 90%,
          rgba(37,217,139,.10),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #05060b,
          #0b1020
        );
    }

    .login-card {
      width: 100%;
      max-width: 430px;

      padding: 35px;

      border-radius: 26px;

      background:
        rgba(18,23,38,.82);

      border:
        1px solid
        rgba(255,255,255,.10);

      backdrop-filter:
        blur(20px);

      box-shadow:
        0 30px 80px
        rgba(0,0,0,.5);
    }

    .logo {
      width: 65px;
      height: 65px;

      margin:
        0 auto 18px;

      display: grid;
      place-items: center;

      border-radius: 19px;

      font-size: 30px;

      background:
        linear-gradient(
          135deg,
          #6c63ff,
          #9a73ff
        );

      box-shadow:
        0 15px 35px
        rgba(108,99,255,.35);
    }

    h1 {
      text-align: center;

      font-size: 30px;

      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;

      color: #8d96aa;

      font-size: 14px;

      line-height: 1.5;

      margin-bottom: 28px;
    }

    .tabs {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 6px;

      padding: 5px;

      border-radius: 13px;

      background:
        rgba(255,255,255,.05);

      margin-bottom: 22px;
    }

    .tab {
      padding: 12px;

      border: none;

      border-radius: 9px;

      background: transparent;

      color: #8d96aa;

      cursor: pointer;

      font-weight: bold;
    }

    .tab.active {
      color: white;

      background: #6c63ff;
    }

    .input-group {
      margin-bottom: 16px;
    }

    label {
      display: block;

      color: #aab1c2;

      font-size: 12px;

      margin-bottom: 7px;
    }

    input {
      width: 100%;

      padding: 14px;

      border-radius: 11px;

      outline: none;

      border:
        1px solid
        rgba(255,255,255,.10);

      background:
        rgba(0,0,0,.25);

      color: white;

      font-size: 14px;
    }

    input:focus {
      border-color: #6c63ff;

      box-shadow:
        0 0 0 3px
        rgba(108,99,255,.12);
    }

    .phone-row {
      display: flex;

      gap: 8px;
    }

    .country-code {
      width: 85px;
    }

    .phone-number {
      flex: 1;
    }

    .main-btn {
      width: 100%;

      padding: 14px;

      border: none;

      border-radius: 12px;

      color: white;

      background:
        linear-gradient(
          135deg,
          #6c63ff,
          #817aff
        );

      font-size: 14px;

      font-weight: bold;

      cursor: pointer;

      transition: .2s;
    }

    .main-btn:hover {
      transform:
        translateY(-1px);
    }

    .secondary-btn {
      margin-top: 10px;

      background:
        rgba(255,255,255,.07);
    }

    .message {
      display: none;

      margin-top: 15px;

      padding: 12px;

      border-radius: 10px;

      text-align: center;

      font-size: 13px;

      line-height: 1.4;
    }

    .message.error {
      display: block;

      color: #ff8297;

      background:
        rgba(255,85,113,.10);
    }

    .message.success {
      display: block;

      color: #51e6a3;

      background:
        rgba(37,217,139,.10);
    }

    .hidden {
      display: none !important;
    }

    .back {
      display: block;

      margin-top: 22px;

      text-align: center;

      text-decoration: none;

      color: #8d96aa;

      font-size: 13px;
    }

    .back:hover {
      color: white;
    }

    #recaptcha-container {
      margin:
        12px 0;
    }

    @media (max-width: 450px) {

      .login-card {
        padding: 25px 20px;
      }

      h1 {
        font-size: 26px;
      }

    }

  </style>

</head>


<body>

  <div class="login-card">

    <div class="logo">
      🎙️
    </div>

    <h1>
      Welcome to BT Mike
    </h1>

    <p class="subtitle">
      Login to use your wireless microphone
    </p>


    <!-- LOGIN METHOD -->

    <div class="tabs">

      <button
        id="emailTab"
        class="tab active"
      >
        📧 Email
      </button>

      <button
        id="phoneTab"
        class="tab"
      >
        📱 Mobile
      </button>

    </div>


    <!-- =========================
         EMAIL
         ========================= -->

    <div id="emailSection">

      <div class="input-group">

        <label>
          Email Address
        </label>

        <input
          type="email"
          id="email"
          placeholder="you@example.com"
          autocomplete="email"
        >

      </div>


      <div class="input-group">

        <label>
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Enter password"
          autocomplete="current-password"
        >

      </div>


      <button
        id="loginEmailBtn"
        class="main-btn"
      >
        🔐 Login with Email
      </button>


      <button
        id="signupEmailBtn"
        class="main-btn secondary-btn"
      >
        📝 Create New Account
      </button>

    </div>


    <!-- =========================
         PHONE
         ========================= -->

    <div
      id="phoneSection"
      class="hidden"
    >

      <div class="input-group">

        <label>
          Mobile Number
        </label>

        <div class="phone-row">

          <input
            id="countryCode"
            class="country-code"
            value="+91"
            type="text"
          >

          <input
            id="phone"
            class="phone-number"
            type="tel"
            placeholder="9876543210"
            autocomplete="tel"
          >

        </div>

      </div>


      <div id="recaptcha-container"></div>


      <button
        id="sendOtpBtn"
        class="main-btn"
      >
        📲 Send OTP
      </button>


      <div
        id="otpSection"
        class="hidden"
      >

        <div
          class="input-group"
          style="margin-top:15px;"
        >

          <label>
            Enter OTP
          </label>

          <input
            id="otp"
            type="text"
            inputmode="numeric"
            maxlength="6"
            placeholder="6 digit OTP"
          >

        </div>


        <button
          id="verifyOtpBtn"
          class="main-btn"
        >
          ✅ Verify OTP
        </button>

      </div>

    </div>


    <div
      id="message"
      class="message"
    ></div>


    <a
      href="index.html"
      class="back"
    >
      ← Back to BT Mike
    </a>

  </div>


  <!-- =========================
       FIREBASE
       ========================= -->

  <script type="module">

    import {
      initializeApp
    } from
    "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      signInWithPhoneNumber,
      RecaptchaVerifier,
      onAuthStateChanged
    } from
    "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


    /*
    =====================================================
    🔥 PASTE YOUR FIREBASE CONFIG HERE
    =====================================================
    */

    const firebaseConfig = {

      apiKey:
        "YOUR_API_KEY",

      authDomain:
        "YOUR_PROJECT.firebaseapp.com",

      projectId:
        "YOUR_PROJECT_ID",

      storageBucket:
        "YOUR_PROJECT.firebasestorage.app",

      messagingSenderId:
        "YOUR_MESSAGING_SENDER_ID",

      appId:
        "YOUR_APP_ID"

    };


    /*
    =====================================================
    INITIALIZE FIREBASE
    =====================================================
    */

    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);


    /*
    =====================================================
    ELEMENTS
    =====================================================
    */

    const emailTab =
      document.getElementById("emailTab");

    const phoneTab =
      document.getElementById("phoneTab");

    const emailSection =
      document.getElementById("emailSection");

    const phoneSection =
      document.getElementById("phoneSection");

    const message =
      document.getElementById("message");


    /*
    =====================================================
    IF ALREADY LOGGED IN
    =====================================================
    */

    onAuthStateChanged(
      auth,
      (user) => {

        if (user) {

          window.location.href =
            "index.html";

        }

      }
    );


    /*
    =====================================================
    EMAIL / PHONE TABS
    =====================================================
    */

    emailTab.addEventListener(
      "click",
      () => {

        emailTab.classList.add(
          "active"
        );

        phoneTab.classList.remove(
          "active"
        );

        emailSection.classList.remove(
          "hidden"
        );

        phoneSection.classList.add(
          "hidden"
        );

        clearMessage();

      }
    );


    phoneTab.addEventListener(
      "click",
      () => {

        phoneTab.classList.add(
          "active"
        );

        emailTab.classList.remove(
          "active"
        );

        phoneSection.classList.remove(
          "hidden"
        );

        emailSection.classList.add(
          "hidden"
        );

        clearMessage();

      }
    );


    /*
    =====================================================
    EMAIL LOGIN
    =====================================================
    */

    document
      .getElementById("loginEmailBtn")
      .addEventListener(
        "click",
        async () => {

          const email =
            document
              .getElementById("email")
              .value
              .trim();

          const password =
            document
              .getElementById("password")
              .value;


          if (!email || !password) {

            showMessage(
              "Please enter email and password.",
              "error"
            );

            return;

          }


          try {

            await signInWithEmailAndPassword(
              auth,
              email,
              password
            );


            showMessage(
              "Login successful! Opening BT Mike...",
              "success"
            );


            setTimeout(
              () => {

                window.location.href =
                  "index.html";

              },
              800
            );


          } catch (error) {

            showMessage(
              firebaseError(error),
              "error"
            );

          }

        }
      );


    /*
    =====================================================
    CREATE ACCOUNT
    =====================================================
    */

    document
      .getElementById("signupEmailBtn")
      .addEventListener(
        "click",
        async () => {

          const email =
            document
              .getElementById("email")
              .value
              .trim();

          const password =
            document
              .getElementById("password")
              .value;


          if (!email || !password) {

            showMessage(
              "Please enter email and password.",
              "error"
            );

            return;

          }


          if (password.length < 6) {

            showMessage(
              "Password must be at least 6 characters.",
              "error"
            );

            return;

          }


          try {

            await createUserWithEmailAndPassword(
              auth,
              email,
              password
            );


            showMessage(
              "Account created successfully!",
              "success"
            );


            setTimeout(
              () => {

                window.location.href =
                  "index.html";

              },
              800
            );


          } catch (error) {

            showMessage(
              firebaseError(error),
              "error"
            );

          }

        }
      );


    /*
    =====================================================
    PHONE OTP
    =====================================================
    */

    let confirmationResult = null;

    let recaptchaVerifier = null;


    document
      .getElementById("sendOtpBtn")
      .addEventListener(
        "click",
        async () => {

          const country =
            document
              .getElementById("countryCode")
              .value
              .trim();

          const phone =
            document
              .getElementById("phone")
              .value
              .trim();


          if (!phone) {

            showMessage(
              "Please enter your mobile number.",
              "error"
            );

            return;

          }


          const fullPhone =
            country + phone;


          try {

            /*
              Create reCAPTCHA
            */

            if (!recaptchaVerifier) {

              recaptchaVerifier =
                new RecaptchaVerifier(
                  auth,
                  "recaptcha-container",
                  {
                    size: "normal"
                  }
                );

              await recaptchaVerifier.render();

            }


            /*
              Send OTP
            */

            confirmationResult =
              await signInWithPhoneNumber(
                auth,
                fullPhone,
                recaptchaVerifier
              );


            document
              .getElementById("otpSection")
              .classList.remove(
                "hidden"
              );


            showMessage(
              "OTP sent successfully.",
              "success"
            );

          } catch (error) {

            showMessage(
              firebaseError(error),
              "error"
            );

          }

        }
      );


    /*
    =====================================================
    VERIFY OTP
    =====================================================
    */

    document
      .getElementById("verifyOtpBtn")
      .addEventListener(
        "click",
        async () => {

          const otp =
            document
              .getElementById("otp")
              .value
              .trim();


          if (!confirmationResult) {

            showMessage(
              "Please request an OTP first.",
              "error"
            );

            return;

          }


          if (!otp) {

            showMessage(
              "Please enter the OTP.",
              "error"
            );

            return;

          }


          try {

            await confirmationResult.confirm(
              otp
            );


            showMessage(
              "Phone verified! Opening BT Mike...",
              "success"
            );


            setTimeout(
              () => {

                window.location.href =
                  "index.html";

              },
              800
            );


          } catch (error) {

            showMessage(
              "Invalid OTP. Please check the OTP and try again.",
              "error"
            );

          }

        }
      );


    /*
    =====================================================
    ERROR HANDLING
    =====================================================
    */

    function firebaseError(error) {

      switch (error.code) {

        case "auth/invalid-credential":
          return "Invalid email or password.";

        case "auth/user-not-found":
          return "No account found with this email.";

        case "auth/wrong-password":
          return "Incorrect password.";

        case "auth/email-already-in-use":
          return "This email is already registered.";

        case "auth/invalid-email":
          return "Please enter a valid email address.";

        case "auth/weak-password":
          return "Password must contain at least 6 characters.";

        case "auth/too-many-requests":
          return "Too many attempts. Please try again later.";

        case "auth/invalid-phone-number":
          return "Invalid mobile number.";

        case "auth/quota-exceeded":
          return "OTP limit exceeded. Please try again later.";

        case "auth/operation-not-allowed":
          return "This login method is not enabled in Firebase.";

        case "auth/unauthorized-domain":
          return "This website domain is not authorized in Firebase.";

        default:
          return error.message ||
            "Something went wrong.";

      }

    }


    /*
    =====================================================
    MESSAGE
    =====================================================
    */

    function showMessage(
      text,
      type
    ) {

      message.innerText =
        text;

      message.className =
        "message " + type;

    }


    function clearMessage() {

      message.innerText = "";

      message.className =
        "message";

    }

  </script>

</body>

</html>
